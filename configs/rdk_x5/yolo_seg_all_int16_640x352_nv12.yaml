# Horizon RDK X5 all-int16 PTQ template for TinySeg YOLO segmentation.
#
# Replace <run> and <camera> paths before calling:
#   hb_mapper makertbin --config configs/rdk_x5/yolo_seg_all_int16_640x352_nv12.yaml --model-type onnx
model_parameters:
  onnx_model: '/workspace/outputs/<run>/best_352x640.onnx'
  march: "bayes-e"
  layer_out_dump: False
  working_dir: '/workspace/outputs/<run>/rdk_x5/.quantize_workspace/bpu_model_output'
  output_model_file_prefix: 'tinyseg_2classes_<camera>_bayese_640x352_nv12'
input_parameters:
  input_name: ""
  input_type_rt: 'nv12'
  input_type_train: 'rgb'
  input_layout_train: 'NCHW'
  norm_type: 'data_scale'
  scale_value: 0.003921568627451
calibration_parameters:
  cal_data_dir: '/workspace/outputs/<run>/rdk_x5/.quantize_workspace/calibration_data'
  cal_data_type: 'float32'
  calibration_type: 'default'
  optimization: set_Softmax_input_int8,set_Softmax_output_int8,set_all_nodes_int16
compiler_parameters:
  jobs: 8
  compile_mode: 'latency'
  debug: true
  optimize_level: 'O3'
