[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyseg"
version = "0.1.0"
description = "Small YOLO segmentation training, export, and Horizon RDK X5 PTQ workflow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "onnx",
  "opencv-python-headless",
  "paramiko",
  "PyYAML",
  "torch",
  "ultralytics",
  "wandb",
]

[project.scripts]
tinyseg-convert-labelme-drivable-stairs = "tinyseg.data.labelme_drivable_stairs:main"
tinyseg-train = "tinyseg.training.train:main"
tinyseg-export-onnx = "tinyseg.export_onnx.export:main"
tinyseg-quantize-x5 = "tinyseg.quantization.quantize:main"
tinyseg-verify-board = "tinyseg.deploy.verify:main"

[tool.setuptools.packages.find]
include = ["tinyseg*"]
